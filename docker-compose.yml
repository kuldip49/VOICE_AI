# docker compose up --build   ->  http://localhost:8080
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - salespilot-data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  salespilot-data:
